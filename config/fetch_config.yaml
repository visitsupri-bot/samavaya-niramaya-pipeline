# ── Samavaya Niramaya Fetch Config ────────────────────────
# Per-niche configuration for YouTube Data API v3 and Google
# Trends queries, opportunity insights, and venue pool.
# Used exclusively by fetcher.py.

niches:
  yoga_india:
    youtube_queries:
      - "yoga for beginners India 2025"
      - "hatha yoga morning routine India"
      - "yoga for back pain Hindi"
      - "pranayama benefits India"
    google_trends_keywords:
      - "yoga classes near me"
      - "online yoga India"
      - "yoga teacher training India"
    opportunity_template: >
      Growing demand for {trend_topic} signals a {trend_direction}
      opportunity in the Indian yoga market. Wellness seekers are
      searching for authentic, teacher-led experiences.
    platform_insights:
      youtube: >
        Yoga content on YouTube India is {trend_direction} — authentic
        teacher-led videos on {trend_topic} are driving the highest
        watch time. First-mover advantage available for structured
        progressive series.
      google_trends: >
        Search demand for {trend_topic} is {trend_direction} across
        India — Tier-1 cities leading, Tier-2 cities catching up fast.
        Condition-specific yoga commands strong pricing power vs.
        generic classes.

  sound_healing:
    youtube_queries:
      - "sound bath meditation 432Hz"
      - "tibetan singing bowls healing"
      - "sound healing session India"
      - "binaural beats meditation"
    google_trends_keywords:
      - "sound healing"
      - "singing bowls therapy"
      - "sound bath near me"
    opportunity_template: >
      {trend_topic} is trending {trend_direction}, pointing to rising
      consumer interest in vibrational wellness and immersive audio
      healing experiences.
    platform_insights:
      youtube: >
        Sound healing content on YouTube is {trend_direction} — videos
        on {trend_topic} averaging strong watch-through rates. No major
        Indian teacher has systematised Nada Yoga + sound bath content
        at scale.
      google_trends: >
        Search interest in {trend_topic} is moving {trend_direction}
        across India — virtually no practitioner in Tier-1 cities
        offering weekly public sound baths at accessible price points.

  corporate_wellness:
    youtube_queries:
      - "corporate yoga office wellness"
      - "desk yoga stretches workplace"
      - "mindfulness for professionals India"
      - "stress relief yoga corporate"
    google_trends_keywords:
      - "corporate wellness program"
      - "employee wellness India"
      - "workplace mindfulness"
    opportunity_template: >
      Corporate searches for {trend_topic} are moving {trend_direction},
      indicating budget allocation toward structured employee wellness
      programs in Indian enterprises.
    platform_insights:
      youtube: >
        Corporate wellness content is {trend_direction} on YouTube —
        {trend_topic} videos targeting HR decision-makers and employees
        are underserved. Short-format desk yoga series have high
        shareability inside organisations.
      google_trends: >
        HR teams are searching {trend_direction} for {trend_topic} —
        Q4 budget cycles drive spike in corporate wellness procurement.
        Long-term contracts available with structured proposals.

  retreat_luxury:
    youtube_queries:
      - "luxury yoga retreat India"
      - "wellness retreat Rishikesh"
      - "Ayurveda retreat Kerala"
      - "silent retreat meditation India"
    google_trends_keywords:
      - "yoga retreat India"
      - "luxury wellness retreat"
      - "Ayurveda retreat"
    opportunity_template: >
      Search interest in {trend_topic} is {trend_direction}, reflecting
      strong post-pandemic appetite for premium wellness travel and
      curated retreat experiences in India.
    platform_insights:
      youtube: >
        Luxury retreat content is {trend_direction} on YouTube —
        {trend_topic} vlogs and immersive retreat documentaries driving
        aspirational demand. Properties actively seeking resident
        facilitators for 2026-27 calendars.
      google_trends: >
        {trend_topic} searches are {trend_direction} — premium retreat
        seekers researching 3-7 day immersions are willing to pay
        ₹40,000+ per block. Sound healing + yoga fusion commands the
        highest per-night rates.

