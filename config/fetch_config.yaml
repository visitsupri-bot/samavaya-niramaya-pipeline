# ── Samavaya Niramaya Fetch Config ────────────────────────
# Per-niche configuration for YouTube Data API v3 and Google
# Trends queries, opportunity insights, and venue pool.
# Used exclusively by fetcher.py.

niches:
  yoga_india:
    # Primary YouTube queries — therapeutic, kids, sound, ayurvedic angles
    youtube_queries:
      - "yoga for anxiety stress relief India 2025"
      - "kids yoga fun poses for children India"
      - "sound bath meditation healing India"
      - "therapeutic yoga for back pain PCOS India"
      - "ayurvedic yoga dosha type India"
      - "pranayama breathing exercises Hindi"
      - "morning yoga routine India beginners"
      - "yoga nidra guided relaxation India"
    # Instagram-style queries via YouTube Shorts to surface Reels trends
    instagram_queries:
      - "yoga shorts reels trending India 2025"
      - "sound healing shorts India Instagram"
      - "kids yoga reels fun India"
      - "therapeutic yoga viral India"
    google_trends_keywords:
      - "yoga for anxiety"
      - "sound healing near me"
      - "kids yoga classes"
      - "therapeutic yoga India"
      - "yoga nidra benefits"
    opportunity_template: >
      Growing demand for {trend_topic} signals a {trend_direction}
      opportunity in the Indian yoga market. Wellness seekers are
      searching for authentic, teacher-led experiences.
    platform_insights:
      youtube: >
        Yoga content on YouTube India is {trend_direction} — authentic
        teacher-led videos on {trend_topic} are driving the highest
        watch time. Therapeutic and condition-specific content commands
        3-5x more watch time than generic yoga flows.
      youtube_kids_sound: >
        Kids yoga and sound healing content is {trend_direction} on YouTube
        — {trend_topic} videos are underserved in India. Parents actively
        search for structured kids wellness content; sound bath sessions
        average 85% watch-through vs 40% for generic content.
      instagram: >
        Instagram Reels on {trend_topic} are {trend_direction} — short-form
        yoga and sound healing content is driving discovery for Indian wellness
        practitioners. Hashtag reach for niche therapeutic content outperforms
        generic yoga 3:1 in India.
      google_trends: >
        Search demand for {trend_topic} is {trend_direction} across
        India — Tier-1 cities leading, Tier-2 cities catching up fast.
        Condition-specific yoga commands strong pricing power vs.
        generic classes.

  sound_healing:
    youtube_queries:
      - "sound bath meditation 432Hz India"
      - "tibetan singing bowls healing India"
      - "nada yoga sound healing"
      - "crystal bowls sound bath India"
      - "binaural beats deep meditation India"
    instagram_queries:
      - "sound bath reels India Instagram 2025"
      - "crystal bowls healing shorts India"
    google_trends_keywords:
      - "sound healing"
      - "singing bowls therapy"
      - "sound bath near me"
    opportunity_template: >
      {trend_topic} is trending {trend_direction}, pointing to rising
      consumer interest in vibrational wellness and immersive audio
      healing experiences.
    platform_insights:
      youtube: >
        Sound healing content on YouTube is {trend_direction} — videos
        on {trend_topic} averaging strong watch-through rates. No major
        Indian teacher has systematised Nada Yoga + sound bath content
        at scale.
      youtube_kids_sound: >
        Sound healing for children is an emerging niche on YouTube India —
        {trend_topic} content has virtually no Indian competition while
        parent search demand is {trend_direction}.
      instagram: >
        Sound bath Reels on {trend_topic} are {trend_direction} on Instagram
        India — short clips of crystal bowl sessions routinely reach 100K+
        organic impressions with zero ad spend.
      google_trends: >
        Search interest in {trend_topic} is moving {trend_direction}
        across India — virtually no practitioner in Tier-1 cities
        offering weekly public sound baths at accessible price points.

  corporate_wellness:
    youtube_queries:
      - "corporate yoga office wellness India"
      - "desk yoga stretches workplace India"
      - "mindfulness stress management professionals India"
      - "employee wellness program yoga India"
    instagram_queries:
      - "corporate wellness yoga reels India"
      - "office yoga shorts India 2025"
    google_trends_keywords:
      - "corporate wellness program India"
      - "employee wellness India"
      - "workplace mindfulness"
    opportunity_template: >
      Corporate searches for {trend_topic} are moving {trend_direction},
      indicating budget allocation toward structured employee wellness
      programs in Indian enterprises.
    platform_insights:
      youtube: >
        Corporate wellness content is {trend_direction} on YouTube —
        {trend_topic} videos targeting HR decision-makers are underserved.
        Short-format desk yoga series have high shareability inside organisations.
      youtube_kids_sound: >
        Workplace sound meditation content is {trend_direction} — companies
        are booking group sound bath sessions as team wellness activities,
        with {trend_topic} content driving discovery.
      instagram: >
        Corporate wellness Reels on {trend_topic} are {trend_direction} —
        HR professionals follow workplace wellness accounts and actively
        share content internally, creating viral discovery loops.
      google_trends: >
        HR teams are searching {trend_direction} for {trend_topic} —
        Q4 budget cycles drive spike in corporate wellness procurement.
        Long-term contracts available with structured proposals.

  retreat_luxury:
    youtube_queries:
      - "luxury yoga retreat India 2025"
      - "wellness retreat Rishikesh sound healing"
      - "Ayurveda retreat Kerala yoga"
      - "silent retreat meditation India"
    instagram_queries:
      - "luxury wellness retreat reels India"
      - "yoga retreat India Instagram 2025"
    google_trends_keywords:
      - "yoga retreat India"
      - "luxury wellness retreat"
      - "Ayurveda retreat"
    opportunity_template: >
      Search interest in {trend_topic} is {trend_direction}, reflecting
      strong post-pandemic appetite for premium wellness travel and
      curated retreat experiences in India.
    platform_insights:
      youtube: >
        Luxury retreat content is {trend_direction} on YouTube —
        {trend_topic} vlogs and immersive retreat documentaries driving
        aspirational demand. Properties actively seeking resident
        facilitators for 2026-27 calendars.
      youtube_kids_sound: >
        Family wellness retreat content featuring kids yoga and sound
        healing is {trend_direction} — an underserved segment that commands
        premium pricing as parents seek holistic family experiences.
      instagram: >
        Retreat Reels on {trend_topic} are {trend_direction} — aspirational
        wellness content drives bookings directly from Instagram discovery,
        with retreat properties actively seeking visiting teachers to
        co-create content.
      google_trends: >
        {trend_topic} searches are {trend_direction} — premium retreat
        seekers researching 3-7 day immersions are willing to pay
        ₹40,000+ per block. Sound healing + yoga fusion commands the
        highest per-night rates.

